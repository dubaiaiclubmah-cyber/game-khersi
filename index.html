<!doctype html>
<html lang="en" data-mode="dark" data-palette="forest">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#06110c" />
    <meta
      name="description"
      content="SERPENT · مار — a bilingual arcade snake game. Eat, grow, survive. Keyboard + touch controls, three speed tiers, stars, medals, themes and persistent high scores."
    />
    <title>SERPENT · Arcade Snake</title>
    <link rel="icon" href="image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2306110c'/%3E%3Crect x='2' y='10' width='4' height='4' fill='%2327a678'/%3E%3Crect x='6' y='10' width='4' height='4' fill='%234de38a'/%3E%3Crect x='6' y='6' width='4' height='4' fill='%234de38a'/%3E%3Crect x='10' y='6' width='4' height='4' fill='%23b8f04d'/%3E%3Crect x='12' y='7' width='1.4' height='1.4' fill='%2306110c'/%3E%3Crect x='10' y='2' width='4' height='4' fill='%23ff6b5e'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@500;600;700&family=Lalezar&family=Vazirmatn:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        /* language + direction before first paint */
        try {
          var lang = localStorage.getItem("serpent.lang");
          if (lang !== "fa" && lang !== "en" && navigator.language) {
            lang = navigator.language.toLowerCase().indexOf("fa") === 0 ? "fa" : "en";
          }
          if (lang === "fa") {
            document.documentElement.lang = "fa";
            document.documentElement.dir = "rtl";
          }
        } catch (e) {}
        /* theme (mode × palette) before first paint */
        try {
          var th = JSON.parse(localStorage.getItem("serpent.theme") || "null");
          var mode = th && th.mode === "light" ? "light" : "dark";
          var pals = ["forest", "ocean", "ember", "night"];
          var pal = th && pals.indexOf(th.palette) >= 0 ? th.palette : "forest";
          document.documentElement.setAttribute("data-mode", mode);
          document.documentElement.setAttribute("data-palette", pal);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
